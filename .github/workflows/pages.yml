# main에 올라오면 빌드해 GitHub Pages로 배포한다. 같은 파일이 비공개 작업 저장소에도 있으므로 공개 저장소에서만 돈다.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'floydkim/vantage-master-v2'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch-soundfont # BGM 사운드폰트(GeneralUser GS, 함께 배포 허락). 받지 못하면 소리 없는 사이트를 올리지 않고 멈춘다
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
